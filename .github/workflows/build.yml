name: Build Web Server

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write   # required for Update PR description

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.24'
        cache: true

    - name: Build application
      run: |
        mkdir -p build
        env GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -v -o build/app .

    - name: Deploy to beforeprod.com
      uses: beforeprod-com/preview-deployment-action@main
      id: beforeprod
      with:
        build_folder: './build'
        platform: 'GO'
      env:
        BP_USER: ${{ secrets.BP_USER }}
        BP_PASSWORD: ${{ secrets.BP_PASSWORD }}
